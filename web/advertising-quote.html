<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>广告制作报价</title><link rel="stylesheet" href="/styles.css"><script src="/auth-guard.js"></script><link rel="stylesheet" href="/app-shell.css"></head>
<body style="visibility:hidden"><main class="page-shell"><header class="topbar"><a class="topbar-link" href="/advertising-quotes.html">← 广告报价</a><div class="topbar-actions"><button id="adv-export-docx" type="button">客户版 Word</button><button id="adv-export-pdf" type="button">客户版 PDF</button><button id="adv-export-internal-docx" class="hidden" type="button">内部核算版 Word</button><button id="adv-export-internal-pdf" class="hidden" type="button">内部核算版 PDF</button><button id="adv-save" type="button">保存报价</button></div></header>
<form id="adv-form" class="advertising-editor">
<section class="panel"><h2>基本信息</h2><div class="advertising-grid"><label>报价主体<select name="entityId"></select></label><label>客户<input name="clientName" required></label><label>项目名称<input name="projectName" required></label><label>报价模式<select name="mode"><option value="standard">普通产品报价</option><option value="project">项目组合报价</option></select></label><label>语言<select name="language"><option value="zh-en">中英双语</option><option value="zh">中文</option><option value="zh-sr">中塞双语</option></select></label><label>VAT模式<select name="vatMode"><option value="exclusive">未税</option><option value="inclusive">含税</option><option value="not_applicable">不适用VAT</option></select></label></div></section>
<section id="adv-groups-panel" class="panel hidden"><div class="panel-head"><h2>项目分组</h2><button id="adv-add-group" type="button">新增分组</button></div><div id="adv-groups"></div></section>
<section class="panel"><div class="panel-head"><h2>产品</h2><button id="adv-add-item" type="button">添加产品</button></div><div id="adv-items"></div></section>
<details class="panel"><summary>配送、安装与特殊施工</summary><div class="advertising-grid"><label><input name="deliveryEnabled" type="checkbox"> 需要配送</label><label>配送次数<input name="deliveryQuantity" type="number" min="0" value="1"></label><label>配送单价<input name="deliveryPrice" type="number" min="0" step="0.01" value="150"></label><label>安装售价<input name="installationPrice" type="number" min="0" step="0.01" value="0"></label><label>最低加工费<input name="minimumProcessingFee" type="number" min="0" step="0.01" value="35"></label><label>最低订单金额<input name="minimumOrderAmount" type="number" min="0" step="0.01" value="75"></label><label>折扣比例(%)<input name="discountPercent" type="number" min="0" max="100" step="0.01" value="0"></label><label>固定优惠<input name="fixedDiscount" type="number" min="0" step="0.01" value="0"></label><label>整单调整<input name="adjustment" type="number" step="0.01" value="0"></label><label>调价原因<textarea name="adjustmentReason"></textarea></label></div></details>
<aside class="panel advertising-summary"><h2>金额汇总</h2><p>未税总额 <strong id="adv-subtotal">0.00 EUR</strong></p><p>VAT <strong id="adv-vat">0.00 EUR</strong></p><p>含税总额 <strong id="adv-total">0.00 EUR</strong></p></aside>
</form></main><script src="/ui-labels.js"></script><script src="/advertising-quote.js"></script><script src="/app-shell.js"></script></body></html>
